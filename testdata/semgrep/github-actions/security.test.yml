name: triage
on:
  pull_request_target:
    types: [opened, synchronize]
  issues:
    types: [opened]

# ruleid: gha-permissions-write-all
permissions: write-all

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      # ruleid: gha-allow-unsecure-commands
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: gha-pull-request-target-checkout-head
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          # ok: gha-pull-request-target-checkout-head
          ref: ${{ github.event.pull_request.base.sha }}
      # ruleid: gha-unpinned-third-party-action
      - uses: some-org/some-action@v2
      # ok: gha-unpinned-third-party-action
      - uses: some-org/some-action@0123456789abcdef0123456789abcdef01234567
      - name: greet
        # ruleid: gha-script-injection
        run: echo "New issue ${{ github.event.issue.title }}"
      - name: safe greet
        env:
          TITLE: ${{ github.event.issue.title }}
        # ok: gha-script-injection
        run: echo "New issue $TITLE"
      - name: multiline
        # ruleid: gha-script-injection
        run: |
          echo "building"
          git checkout ${{ github.head_ref }}
      - uses: actions/github-script@v7
        with:
          # ruleid: gha-script-injection
          script: |
            console.log("${{ github.event.pull_request.title }}")
